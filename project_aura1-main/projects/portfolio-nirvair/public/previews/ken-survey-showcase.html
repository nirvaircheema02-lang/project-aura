<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ken Survey — full-page showcase concept</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #24212e; background: #d9d4e7; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      .scene { position: relative; width: 100%; min-height: 1180px; overflow: hidden; background: radial-gradient(circle at 82% 14%, #e8e3ef 0, transparent 37%), radial-gradient(circle at 14% 76%, #c9c2df 0, transparent 32%), #d9d4e7; }
      .scene::after { content: ""; position: absolute; z-index: 0; left: -10%; right: -10%; bottom: -170px; height: 350px; background: radial-gradient(ellipse, rgba(70, 55, 98, .2), transparent 67%); filter: blur(45px); pointer-events: none; }
      .intro { position: relative; z-index: 10; max-width: 1440px; margin: auto; padding: 60px 64px 0; }
      .eyebrow { margin: 0; color: #554a73; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      h1 { max-width: 760px; margin: 16px 0 0; font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(38px, 4.3vw, 67px); letter-spacing: -.04em; line-height: 1.03; }
      .intro p:last-child { margin: 18px 0 0; max-width: 500px; color: #615b6d; font-size: 15px; line-height: 1.55; }
      .pages { position: relative; width: 1440px; max-width: 100%; height: 950px; margin: -4px auto 0; }
      .page { position: absolute; display: block; overflow: hidden; border: 1px solid rgba(255,255,255,.83); border-radius: 5px 5px 0 0; background: white; box-shadow: 0 54px 85px -35px rgba(47,38,65,.38), 0 10px 25px rgba(47,38,65,.14); text-decoration: none; transform-origin: top center; transition: transform .35s ease, box-shadow .35s ease; }
      .page:hover, .page:focus-visible { box-shadow: 0 68px 95px -35px rgba(47,38,65,.43), 0 15px 35px rgba(47,38,65,.2); outline: 2px solid #6151a5; outline-offset: 3px; }
      .page--left { z-index: 1; top: 176px; left: 8%; width: 405px; transform: perspective(1200px) rotateY(7deg) rotateZ(-4deg); }
      .page--left:hover, .page--left:focus-visible { transform: perspective(1200px) rotateY(7deg) rotateZ(-4deg) translateY(-10px); }
      .page--center { z-index: 3; top: 96px; left: calc(50% - 235px); width: 470px; transform: perspective(1200px) rotateX(1deg) rotateZ(-.5deg); }
      .page--center:hover, .page--center:focus-visible { transform: perspective(1200px) rotateX(1deg) rotateZ(-.5deg) translateY(-10px); }
      .page--right { z-index: 2; top: 185px; right: 8%; width: 405px; transform: perspective(1200px) rotateY(-7deg) rotateZ(4deg); }
      .page--right:hover, .page--right:focus-visible { transform: perspective(1200px) rotateY(-7deg) rotateZ(4deg) translateY(-10px); }
      .chrome { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-bottom: 1px solid #e6e6e8; background: #f8f8f9; }
      .dot { width: 6px; height: 6px; border-radius: 100%; background: #e6b8b4; }
      .dot:nth-child(2) { background: #eddf9f; }
      .dot:nth-child(3) { background: #b8d9bd; }
      .address { width: 42%; height: 11px; margin: 0 auto; border: 1px solid #e2e3e7; border-radius: 10px; background: #efeff1; }
      .screen { display: block; width: 100%; height: auto; }
      .hint { position: absolute; z-index: 5; right: 64px; bottom: 30px; color: #524c61; font-size: 12px; letter-spacing: .02em; }
      @media (max-width: 800px) {
        .scene { min-height: 850px; }
        .intro { padding: 40px 24px 0; }
        .intro p:last-child { max-width: 300px; }
        .pages { width: 800px; max-width: none; height: 700px; left: 50%; margin-left: -400px; transform: scale(.65); transform-origin: top center; }
        .page--left { left: 0; }
        .page--right { right: 0; }
        .hint { right: 24px; bottom: 18px; }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="intro">
        <p class="eyebrow">Ken Survey / Website ecosystem</p>
        <h1>One system.<br />Different research needs.</h1>
        <p>Three real survey pages shown as long website captures. Open any panel to see the complete page.</p>
      </div>
      <div class="pages" aria-label="Three Ken Survey page mockups">
        <a class="page page--left" href="/previews/ken-survey-showcase/employee.png" target="_blank" aria-label="Open complete Employee Engagement page capture">
          <span class="chrome" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="address"></span></span>
          <img class="screen" src="/previews/ken-survey-showcase/employee.png" alt="Complete Employee Engagement survey page" />
        </a>
        <a class="page page--center" href="/previews/ken-survey-showcase/brand.png" target="_blank" aria-label="Open complete Brand Perception page capture">
          <span class="chrome" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="address"></span></span>
          <img class="screen" src="/previews/ken-survey-showcase/brand.png" alt="Complete Brand Perception survey page" />
        </a>
        <a class="page page--right" href="/previews/ken-survey-showcase/dealers.png" target="_blank" aria-label="Open complete Dealer's Voice page capture">
          <span class="chrome" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="address"></span></span>
          <img class="screen" src="/previews/ken-survey-showcase/dealers.png" alt="Complete Dealer's Voice survey page" />
        </a>
      </div>
      <span class="hint">Concept preview · Click a page to inspect its full capture</span>
    </main>
  </body>
</html>
