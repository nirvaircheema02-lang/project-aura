    - generic [ref=e528] [box=120,6338,1200,632]:
      - heading "FAQs" [level=2] [ref=e529] [box=120,6338,1200,48]
      - list [ref=e531] [box=313,6410,814,560]:
        - listitem [ref=e532] [cursor=pointer] [box=313,6410,814,45]:
          - heading "How do I know whether poor sales are caused by weak brand perception or other market factors?" [level=3] [ref=e535] [box=337,6422,710,20]
          - paragraph [box=337,6442,710,0]:
            - paragraph [ref=e536] [box=337,6442,710,20]: "We analyze three layers together:"
            - list [ref=e537] [box=337,6466,710,60]:
              - listitem [ref=e538] [box=357,6466,690,20]: Market demand
              - listitem [ref=e539] [box=357,6486,690,20]: Brand perception
              - listitem [ref=e540] [box=357,6506,690,20]: Purchase behavior
            - paragraph [ref=e541] [box=337,6530,710,40]: If perception drops while the category grows then it’s a brand issue. If perception is strong but conversions lag then it’s pricing, distribution, or product.
            - paragraph [ref=e542] [box=337,6574,710,20]: Our survey isolates perception as a variable so you know whether the brand is the bottleneck or not.
        - listitem [ref=e543] [cursor=pointer] [box=313,6455,814,45]:
          - heading "Can a brand perception survey explain why marketing campaigns are underperforming?" [level=3] [ref=e546] [box=337,6467,710,20]
          - paragraph [box=337,6487,710,0]:
            - paragraph [ref=e547] [box=337,6487,710,40]: Yes, often very clearly. Campaigns fail not because of execution, but because they conflict with existing brand beliefs.
            - paragraph [ref=e548] [box=337,6531,710,20]: If your communication claims something people do not already associate with your brand, it creates friction.
            - paragraph [ref=e549] [box=337,6555,710,20]: Brand perception surveys reveal this misalignment before significant media budgets are wasted.
        - listitem [ref=e550] [cursor=pointer] [box=313,6500,814,45]:
          - heading "Can a brand perception study quantify hidden biases customers have about my brand?" [level=3] [ref=e553] [box=337,6512,710,20]
          - paragraph [box=337,6532,710,0]:
            - paragraph [ref=e554] [box=337,6532,710,40]: "Yes. Using indirect questioning, association testing, brand mapping, and sentiment analysis, we decode latent biases people don’t openly express such as:"
            - list [ref=e555] [box=337,6576,710,60]:
              - listitem [ref=e556] [box=357,6576,690,20]: This brand feels outdated.
              - listitem [ref=e557] [box=357,6596,690,20]: This looks premium but I don’t trust it.
              - listitem [ref=e558] [box=357,6616,690,20]: They’re good but not for people like me.
            - paragraph [ref=e559] [box=337,6640,710,20]: We uncover what people think, not just what they say.
        - listitem [ref=e560] [cursor=pointer] [box=313,6545,814,45]:
          - heading "How do you measure brand trust, relevance, and preference in a way that drives real business decisions?" [level=3] [ref=e563] [box=337,6557,710,20]
          - paragraph [box=337,6577,710,0]:
            - paragraph [ref=e564] [box=337,6577,710,20]: "We measure each component with multi-dimensional indicators:"
            - list [ref=e565] [box=337,6601,710,60]:
              - listitem [ref=e566] [box=357,6601,690,20]: Trust – credibility, reliability, fairness, promise delivery
              - listitem [ref=e567] [box=357,6621,690,20]: Relevance – category fit, modernity, customer alignment
              - listitem [ref=e568] [box=357,6641,690,20]: Preference – likelihood of choosing the brand vs. alternatives
            - paragraph [ref=e569] [box=337,6665,710,20]: Then we link each score to sales uplift, market share, customer lifetime value, and switching behavior.
            - paragraph [ref=e570] [box=337,6689,710,20]: This makes perception actionable and not theoretical.
        - listitem [ref=e571] [cursor=pointer] [box=313,6590,814,45]:
          - heading "Can a Brand Perception Survey tell me why people choose my competitor even if they like my brand?" [level=3] [ref=e574] [box=337,6602,710,20]
          - paragraph [box=337,6622,710,0]:
            - paragraph [ref=e575] [box=337,6622,710,20]: "Absolutely. People may like your brand emotionally but choose competitors for functional reasons like:"
            - list [ref=e576] [box=337,6646,710,100]:
              - listitem [ref=e577] [box=357,6646,690,20]: Price
              - listitem [ref=e578] [box=357,6666,690,20]: Distribution
              - listitem [ref=e579] [box=357,6686,690,20]: Features
              - listitem [ref=e580] [box=357,6706,690,20]: Convenience
              - listitem [ref=e581] [box=357,6726,690,20]: Peer influence
            - paragraph [ref=e582] [box=337,6750,710,40]: We map the difference between emotional liking and actual buying reasons, so you see where the real drop-off happens.
        - listitem [ref=e583] [cursor=pointer] [box=313,6635,814,45]:
          - heading "If my brand is new or mid-stage, will a perception study still give meaningful insights?" [level=3] [ref=e586] [box=337,6647,710,20]
          - paragraph [box=337,6667,710,0]:
            - paragraph [ref=e587] [box=337,6667,710,20]: "Yes, in fact, new brands benefit the most. You learn:"
            - list [ref=e588] [box=337,6691,710,100]:
              - listitem [ref=e589] [box=357,6691,690,20]: Your early reputation
              - listitem [ref=e590] [box=357,6711,690,20]: First impressions
              - listitem [ref=e591] [box=357,6731,690,20]: What messaging works
              - listitem [ref=e592] [box=357,6751,690,20]: What positioning confuses people
              - listitem [ref=e593] [box=357,6771,690,20]: Where you already outperform incumbents
        - listitem [ref=e594] [cursor=pointer] [box=313,6680,814,65]:
          - heading "Can you benchmark my brand perception against competitors, even if the competitors are not large brands?" [level=3] [ref=e597] [box=337,6692,710,40]
          - paragraph [box=337,6732,710,0]:
            - paragraph [ref=e598] [box=337,6732,710,20]: "Yes. We can benchmark against:"
            - list [ref=e599] [box=337,6756,710,100]:
              - listitem [ref=e600] [box=357,6756,690,20]: Direct competitors
              - listitem [ref=e601] [box=357,6776,690,20]: Regional players
              - listitem [ref=e602] [box=357,6796,690,20]: Category substitutes
              - listitem [ref=e603] [box=357,6816,690,20]: Digital-first brands
              - listitem [ref=e604] [box=357,6836,690,20]: Emerging challengers
            - paragraph [ref=e605] [box=337,6860,710,20]: Perception benchmarking doesn’t require competitors to be large but only relevant.
        - listitem [ref=e606] [cursor=pointer] [box=313,6745,814,45]:
          - heading "What frameworks or models do you use to analyze perception gaps?" [level=3] [ref=e609] [box=337,6757,710,20]
          - paragraph [box=337,6777,710,0]:
            - list [ref=e610] [box=337,6777,710,120]:
              - listitem [ref=e611] [box=357,6777,690,20]: Perception Gap Analysis (Internal vs. Market view)
              - listitem [ref=e612] [box=357,6797,690,20]: Value Proposition Fit Matrix
              - listitem [ref=e613] [box=357,6817,690,20]: Trust–Relevance–Preference Model
              - listitem [ref=e614] [box=357,6837,690,20]: Emotional vs. Functional Attribute Mapping
              - listitem [ref=e615] [box=357,6857,690,20]: 4D Brand Strength Index
              - listitem [ref=e616] [box=357,6877,690,20]: Category Archetype Mapping
            - paragraph [ref=e617] [box=337,6901,710,20]: These frameworks show precisely where your brand is losing or gaining ground.
        - listitem [ref=e618] [cursor=pointer] [box=313,6790,814,45]:
          - heading "How is a Brand Perception Survey different from a Customer Satisfaction or NPS survey?" [level=3] [ref=e621] [box=337,6802,710,20]
          - paragraph [box=337,6822,710,0]:
            - list [ref=e622] [box=337,6822,710,60]:
              - listitem [ref=e623] [box=357,6822,690,20]: Brand Perception – What they think about the brand overall
              - listitem [ref=e624] [box=357,6842,690,20]: Customer Satisfaction – How they feel after using your product
              - listitem [ref=e625] [box=357,6862,690,20]: NPS – How likely they are to recommend you
            - paragraph [ref=e626] [box=337,6886,710,20]: Perception is broader and includes non-users, competitors, and market views.
        - listitem [ref=e627] [cursor=pointer] [box=313,6835,814,45]:
          - heading "Can a perception study help me reposition or rebrand effectively?" [level=3] [ref=e630] [box=337,6847,710,20]
          - paragraph [box=337,6867,710,0]:
            - paragraph [ref=e631] [box=337,6867,710,20]: "Yes. It gives you a data-backed blueprint for:"
            - list [ref=e632] [box=337,6891,710,120]:
              - listitem [ref=e633] [box=357,6891,690,20]: What to keep
              - listitem [ref=e634] [box=357,6911,690,20]: What to drop
              - listitem [ref=e635] [box=357,6931,690,20]: What to amplify
              - listitem [ref=e636] [box=357,6951,690,20]: Where perception is misaligned
              - listitem [ref=e637] [box=357,6971,690,20]: What the market is ready to accept
              - listitem [ref=e638] [box=357,6991,690,20]: What your new narrative should be
            - paragraph [ref=e639] [box=337,7015,710,20]: Repositioning without perception insights is guesswork.
        - listitem [ref=e640] [cursor=pointer] [box=313,6880,814,45]:
          - heading "Will the study help identify which channels damage or lift perception?" [level=3] [ref=e643] [box=337,6892,710,20]
          - paragraph [box=337,6912,710,0]:
            - paragraph [ref=e644] [box=337,6912,710,20]: "Yes. We map perception scores by channel to show:"
            - list [ref=e645] [box=337,6936,710,80]:
              - listitem [ref=e646] [box=357,6936,690,20]: Where perception improves
              - listitem [ref=e647] [box=357,6956,690,20]: Where it deteriorates
              - listitem [ref=e648] [box=357,6976,690,20]: Which touchpoints build trust
              - listitem [ref=e649] [box=357,6996,690,20]: Which erode credibility
            - paragraph [ref=e650] [box=337,7020,710,20]: This tells you where to invest, reduce, or recalibrate visibility.
        - listitem [ref=e651] [cursor=pointer] [box=313,6925,814,45]:
          - heading "What does a complete brand perception dashboard look like?" [level=3] [ref=e654] [box=337,6937,710,20]
          - paragraph [box=337,6957,710,0]:
            - list [ref=e655] [box=337,6957,710,140]:
              - listitem [ref=e656] [box=357,6957,690,20]: Brand Strength Score
              - listitem [ref=e657] [box=357,6977,690,20]: Competitive positioning map
              - listitem [ref=e658] [box=357,6997,690,20]: Key attribute performance
              - listitem [ref=e659] [box=357,7017,690,20]: Messaging effectiveness
              - listitem [ref=e660] [box=357,7037,690,20]: Sentiment analysis
              - listitem [ref=e661] [box=357,7057,690,20]: Segment-wise perception scores
              - listitem [ref=e662] [box=357,7077,690,20]: Recommended actions
            - paragraph [ref=e663] [box=337,7101,710,20]: It acts as your brand control center.
